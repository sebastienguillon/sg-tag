# Git hooks — https://lefthook.dev
# Installed automatically by `pnpm install` (lefthook's postinstall).
glob_matcher: doublestar
# This repository does not use Git LFS: don't run its hooks even when git-lfs is installed.
skip_lfs: true

pre-commit:
  piped: true
  jobs:
    - name: eslint
      glob: '**/*.{ts,js,html}'
      run: pnpm exec eslint --max-warnings 0 --fix {staged_files}
      stage_fixed: true
    - name: prettier
      glob: '**/*.{ts,js,html,css,json,md,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test
