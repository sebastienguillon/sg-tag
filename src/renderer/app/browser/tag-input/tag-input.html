<div class="field">
  <app-icon name="tag" />
  <input
    #input
    type="text"
    role="combobox"
    aria-autocomplete="list"
    spellcheck="false"
    autocomplete="off"
    [attr.aria-label]="label()"
    [placeholder]="label()"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="listId"
    [attr.aria-activedescendant]="activeId()"
    [attr.aria-invalid]="problem() === null ? null : 'true'"
    [attr.aria-describedby]="problem() === null ? null : problemId"
    [value]="text()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (focus)="focused.set(true)"
    (blur)="focused.set(false)"
  />
</div>
@if (problem(); as sentence) {
  <p class="problem" role="alert" [id]="problemId">{{ sentence }}</p>
}
@if (expanded()) {
  <ul class="suggestions" role="listbox" [id]="listId">
    @for (row of rows(); track row.key) {
      <li
        role="option"
        [id]="`${listId}-${$index}`"
        [attr.aria-selected]="$index === active()"
        [attr.aria-disabled]="row.action === 'refuse' ? 'true' : null"
      >
        <button
          type="button"
          tabindex="-1"
          [class.active]="$index === active()"
          [class.disabled]="row.action === 'refuse'"
          (mousedown)="$event.preventDefault()"
          (click)="choose(row)"
        >
          <span class="name"
            ><span class="label">{{ row.label }}</span>
            @if (row.note !== null) {
              <span class="note">: {{ row.note }}</span>
            }
          </span>
          @if (row.count !== null) {
            <span class="count">{{ row.count }}</span>
          }
        </button>
      </li>
    }
  </ul>
}
