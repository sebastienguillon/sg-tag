@if (state() === 'playing') {
  <video
    #video
    controls
    autoplay
    tabindex="0"
    [src]="source()"
    (loadedmetadata)="checkPicture(video)"
    (error)="state.set('failed')"
  ></video>
} @else {
  <img alt="" [src]="poster()" />
  @if (available()) {
    @if (playable() && state() === 'poster') {
      <button
        type="button"
        class="play"
        aria-label="Play video"
        title="Play"
        (click)="state.set('playing')"
      >
        <app-icon name="play" />
      </button>
    } @else {
      <p class="note" role="status">Can’t play this video here. Use Open.</p>
    }
  }
}
